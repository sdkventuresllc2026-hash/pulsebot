# Pulse — run on Railway only (1 replica; mount a volume at /data)
[build]
builder = "nixpacks"

[deploy]
# Ensures data dir even if the dashboard variable was missed (volume must still mount at /data)
startCommand = "PULSE_DATA_DIR=/data npm start"
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
